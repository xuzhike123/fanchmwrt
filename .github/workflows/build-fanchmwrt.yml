name: Build FanchmWrt Firmware

on:
  workflow_dispatch: # 支持手动点击按钮触发编译
  # push:
  #   branches: [ fanchmwrt-25.12.4 ] # 如果希望提交代码时自动编译，可以取消注释

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.4 # 或其他目标分支
  CONFIG_FILE: '.config'
  DIY_P1_SH: 'diy-part1.sh'
  DIY_P2_SH: 'diy-part2.sh'
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false

jobs:
  build:
    runs-on: ubuntu-22.04 # 官方推荐 Ubuntu 22.04 环境

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/env
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e $(CONFIG_FILE) ] && mv $(CONFIG_FILE) .config
        # 如果你提前准备好了 .config 文件，可以放在仓库根目录

    - name: Generate Configuration
      run: |
        # 默认生成 x86_64 或通用配置，建议先通过本地 make menuconfig 导出生成 .config
        make defconfig

    - name: Download package
      id: package
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -rf {} \;

    - name: Compile the firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: FanchmWrt_Firmware
        path: bin/targets/
