name: Build FanchmWrt for OneCloud (玩客云)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 gawk gettext git libssl-dev libglib2.0-dev libxml2-utils p7zip p7zip-full patch perl python3 python3-pip python3-ply python3-docutils python3-pyelftools rsync subversion unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion libncurses5-dev libncursesw5-dev libgnutls28-dev flex uglifyjs git-core gcc-multilib psmisc build-essential mkisofs
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: One-Click Patch OneCloud (一键移植玩客云 DTS 及设备定义)
        run: |
          # 1. 确保目标目录存在
          mkdir -p target/linux/amlogic/files/arch/arm/boot/dts/amlogic
          mkdir -p target/linux/amlogic/image

          # 2. 从成熟社区仓库下载玩客云 DTS 设备树文件
          curl -sL "https://raw.githubusercontent.com/xydche/onecloud-openwrt/main/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts" \
            -o target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts || true

          # 3. 如果编译需要 meson8b.dtsi 基础文件，补全基础 DTS
          curl -sL "https://raw.githubusercontent.com/openwrt/openwrt/master/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b.dtsi" \
            -o target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b.dtsi || true

          # 4. 注入/覆盖 meson8b.mk (Target Makefile 设备定义)
          curl -sL "https://raw.githubusercontent.com/xydche/onecloud-openwrt/main/target/linux/amlogic/image/meson8b.mk" \
            -o target/linux/amlogic/image/meson8b.mk || true

          # 5. 确保 meson8b.mk 在主 Makefile 中被引用 (防止未包含)
          if [ -f target/linux/amlogic/image/Makefile ]; then
            grep -q "meson8b.mk" target/linux/amlogic/image/Makefile || echo 'include meson8b.mk' >> target/linux/amlogic/image/Makefile
          fi

      - name: Configure Target Architecture
        run: |
          # 强制指定 Target 架构为 Amlogic
          echo "CONFIG_TARGET_amlogic=y" > .config
          echo "CONFIG_TARGET_amlogic_meson8b=y" >> .config
          echo "CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize Firmware Files
        id: organize
        run: |
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt_OneCloud_Firmware
          path: ${{ env.FIRMWARE }}/*
