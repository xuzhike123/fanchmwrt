name: Build FanchmWrt for OneCloud (玩客云)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 gawk gettext git libssl-dev libglib2.0-dev libxml2-utils p7zip p7zip-full patch perl python3 python3-pip python3-ply python3-docutils python3-pyelftools rsync subversion unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion libncurses5-dev libncursesw5-dev libgnutls28-dev flex uglifyjs git-core gcc-multilib psmisc build-essential mkisofs
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Patch OneCloud Support into FanchmWrt
      run: |
        # 1. 自动从社区支持玩客云的 OpenWrt 仓库拉取 meson8b 设备树和板级定义
        svn checkout https://github.com/coolsnowwolf/lede/trunk/target/linux/amlogic/files/arch/arm/boot/dts/amlogic target/linux/amlogic/files/arch/arm/boot/dts/amlogic || true
        
        # 2. 如果缺少 meson8b 镜像配置文件，补全文件
        curl -sL https://raw.githubusercontent.com/xydche/onecloud-openwrt/main/diy-part1.sh | bash || true    

    - name: Load & Expand Configuration
      run: |
        # 自动读取仓库根目录下的 .config 并补全所有依赖选项
        make defconfig

    - name: Download Package Sources
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FanchmWrt_OneCloud_Firmware
        path: |
          bin/targets/*/*/*
          bin/targets/*/*/*.*
