name: Build FanchmWrt for OneCloud

on:
  workflow_dispatch:

# 针对 ARM32 架构，强制全局使用 Node 20 运行 Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space & Init Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 gawk gettext git libssl-dev libglib2.0-dev libxml2-utils p7zip p7zip-full patch perl python3 python3-pip python3-ply python3-docutils python3-pyelftools rsync subversion unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion libncurses5-dev libncursesw5-dev libgnutls28-dev flex uglifyjs git-core gcc-multilib psmisc build-essential mkisofs u-boot-tools dosfstools mtools uuid-runtime
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch OneCloud Target & DTS
        run: |
          mkdir -p target/linux/amlogic/files/arch/arm/boot/dts/amlogic
          mkdir -p target/linux/amlogic/image

          # 下载玩客云 DTS 及设备配置
          curl -sL "https://raw.githubusercontent.com/xydche/onecloud-openwrt/main/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts" \
            -o target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts || true

          curl -sL "https://raw.githubusercontent.com/openwrt/openwrt/master/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b.dtsi" \
            -o target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b.dtsi || true

          curl -sL "https://raw.githubusercontent.com/xydche/onecloud-openwrt/main/target/linux/amlogic/image/meson8b.mk" \
            -o target/linux/amlogic/image/meson8b.mk || true

          if [ -f target/linux/amlogic/image/Makefile ]; then
            grep -q "meson8b.mk" target/linux/amlogic/image/Makefile || echo 'include meson8b.mk' >> target/linux/amlogic/image/Makefile
          fi

      - name: Force Switch Target to Amlogic OneCloud
        run: |
          rm -f .config
          echo "CONFIG_TARGET_amlogic=y" > .config
          echo "CONFIG_TARGET_amlogic_meson8b=y" >> .config
          echo "CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize Firmware Directory
        id: organize
        run: |
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt_OneCloud_Firmware
          path: |
            ${{ env.FIRMWARE }}/*.img*
            ${{ env.FIRMWARE }}/*.tar.gz
